name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run on demand. The live-project checks below can go red without this repo
  # changing at all — someone applying a migration or an RLS policy straight to
  # the database is exactly the case they exist to catch. Re-running should not
  # require inventing a commit.
  workflow_dispatch:

jobs:
  # ── The gate. Everything here is deterministic and needs no credentials, so
  # it verifies the same thing on every branch and fork. Kept as its own job
  # (named `check`, the required status) so a failure in the credentialed
  # live-project checks below can never again abort build/SEO/test verification
  # — the failure mode that let two days of unverified builds merge green when
  # the SUPABASE_ACCESS_TOKEN secret went bad (docs/TODO.md OA19).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      # Message-surface scope guard (workspace/marketing/shared) — a literal
      # t('key') reaching outside its file's surface.
      - name: Message scopes
        run: npm run check:message-scopes

      # Canonical-facts drift: the brand-palette rows of docs/CANONICAL_FACTS.md
      # vs src/styles/. The rest of that file's code-backed rows are covered by
      # src/canonicalFacts.test.ts in the test step; this half is separate only
      # because Vitest runs with css:false and cannot read a stylesheet.
      - name: Canonical facts
        run: npm run check:facts

      # Production build: client + SSR bundles, prerender of every public page
      # (EN + FR), dist-level SEO crawl validation, entry-graph budget, and the
      # service worker. Fails on any metadata/sitemap/link/build drift.
      - name: Build + SEO validation
        run: npm run build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID || 'G-V85ZQ75EWL' }}

  # ── Live-project checks. These hit the real Supabase project and only run
  # once their credentials exist as repository secrets/variables (fork PRs and
  # unconfigured repos skip cleanly rather than failing). Isolated in their own
  # job so a credential problem fails only here, never the gate above. The two
  # steps use `if: ${{ !cancelled() }}` so the RLS check still runs even when
  # the migration-drift step fails — each live check reports independently.
  live-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Migration integrity + drift: every local migration compared against
      # supabase_migrations.schema_migrations, in both directions (repo-not-
      # applied, and applied-with-no-file). Filename discipline always runs;
      # the drift half needs SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF.
      - name: Migration drift
        run: npm run check:migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # RLS regression guard: as the anon role, confirm the sensitive tables
      # (beta_signups, hr_documents, signatures) return no rows and a known
      # public table does — catching the out-of-band world-open policies the
      # 2026-08-08 audit found (migration 0073). Needs SUPABASE_URL and the
      # public SUPABASE_ANON_KEY (safe as a repository variable). `if:
      # !cancelled()` so a drift failure above doesn't skip it.
      - name: RLS regression check
        if: ${{ !cancelled() }}
        run: npm run check:rls
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

  # ── End-to-end smoke tests. Builds the production bundle and drives it in a
  # real Chromium behind the same routing contract Vercel serves (via
  # e2e/serve-dist.mjs), catching integration regressions the jsdom unit tests
  # structurally cannot: prerender + hydration, the /app rewrite, clean-URL
  # routing, and the analytics consent gate. Its own job — deterministic and
  # credential-free like `check`, but a browser download and runtime that a
  # real-Chromium flake should never be allowed to charge against the gate.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # GitHub's runners have no preinstalled browser (unlike some managed
      # dev environments), so fetch Chromium and its OS libraries here. The
      # Playwright config points at a preinstalled binary only when one exists,
      # so this install is what it falls back to.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The e2e server (e2e/serve-dist.mjs) serves dist/, so build it first.
      - name: Build
        run: npm run build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID || 'G-V85ZQ75EWL' }}

      - name: Run e2e smoke tests
        run: npm run test:e2e
