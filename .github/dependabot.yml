# Automated dependency updates — npm packages and GitHub Actions.
# Dependabot opens PRs; npm run check must pass before merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      vite:
        patterns:
          - vite
          - '@vitejs/*'
      testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@testing-library/*'
          - '@playwright/*'
      react:
        patterns:
          - react
          - react-dom
          - react-router-dom
          - '@types/react*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
