<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Dutiva app icon</title>
  <desc id="desc">White rounded-square tile with the Dutiva maple leaf mark.</desc>

  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEF0F6" />
    </linearGradient>

    <clipPath id="iconClip">
      <rect x="12" y="12" width="1000" height="1000" rx="205" ry="205" />
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <rect x="12" y="12" width="1000" height="1000" rx="205" ry="205" fill="url(#tileBg)" />
    <image href="dutiva-leaf.png" x="195" y="195" width="634" height="634" />
  </g>

  <rect x="12" y="12" width="1000" height="1000" rx="205" ry="205" fill="none" stroke="#B48C3C" stroke-opacity="0.16" stroke-width="2" />
</svg>
